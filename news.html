<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>更新情報 — 英単語ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root, [data-theme="night"]{
  --bg:#10152b; --bg-elevate:#161d3a; --surface:#212a52; --surface-2:#2a3563;
  --ink:#eef1f8; --ink-dim:#94a0c9; --ink-faint:#5c6796;
  --gold:#e8b95f; --gold-dim:#8a733f; --good:#6fcf97; --warn:#f0c869; --bad:#e8748a;
  --serif:'Shippori Mincho', serif; --sans:'Zen Kaku Gothic New', sans-serif;
}
[data-theme="morning"]{
  --bg:#fbf6ec; --bg-elevate:#ffffff; --surface:#fff3de; --surface-2:#ffe9c2;
  --ink:#3a2f1c; --ink-dim:#8a7455; --ink-faint:#b6a482;
  --gold:#d98a3d; --gold-dim:#b8763a; --good:#4e9d6f; --warn:#d98a3d; --bad:#c0563f;
  --serif:'Shippori Mincho', serif; --sans:'Zen Kaku Gothic New', sans-serif;
}
[data-theme="mint"]{
  --bg:#0e2321; --bg-elevate:#123832; --surface:#184a41; --surface-2:#1f5c50;
  --ink:#eafff6; --ink-dim:#8fd9c4; --ink-faint:#4f9a86;
  --gold:#4fe3b0; --gold-dim:#2e9c78; --good:#7ee8a8; --warn:#e8d24f; --bad:#e87e8a;
  --serif:'Shippori Mincho', serif; --sans:'Zen Kaku Gothic New', sans-serif;
}
[data-theme="sakura"]{
  --bg:#241820; --bg-elevate:#33212c; --surface:#452b3a; --surface-2:#5a3549;
  --ink:#fff0f5; --ink-dim:#e0aec4; --ink-faint:#a9758e;
  --gold:#f2a6c4; --gold-dim:#c47693; --good:#7ee8a8; --warn:#f0c869; --bad:#e8748a;
  --serif:'Shippori Mincho', serif; --sans:'Zen Kaku Gothic New', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  min-height:100vh; display:flex; justify-content:center; padding:20px 14px 60px;
}
.wrap{ width:100%; max-width:640px; }
.eyebrow{ font-size:11px; letter-spacing:0.28em; color:var(--gold); font-weight:500; }
h1{ font-family:var(--serif); font-size:22px; margin-top:4px; margin-bottom:4px; }
.sub{ font-size:12px; color:var(--ink-dim); margin-bottom:22px; }
a.back-link{ font-size:11.5px; color:var(--gold-dim); text-decoration:underline; }

.timeline{ display:flex; flex-direction:column; gap:0; }
.news-item{
  position:relative;
  padding:0 0 26px 26px;
  border-left:1px solid rgba(255,255,255,0.12);
}
.news-item:last-child{ border-left-color:transparent; padding-bottom:0; }
.news-dot{
  position:absolute; left:-5px; top:2px;
  width:9px; height:9px; border-radius:50%;
  background:var(--gold); box-shadow:0 0 0 3px var(--bg);
}
.news-date{ font-size:11px; color:var(--ink-faint); letter-spacing:0.04em; margin-bottom:4px; }
.news-title{ font-family:var(--serif); font-size:16px; font-weight:700; color:var(--gold); margin-bottom:8px; }
.news-items{ margin:0; padding-left:18px; }
.news-items li{ font-size:13px; color:var(--ink-dim); line-height:1.7; margin-bottom:4px; }
.empty-msg{ text-align:center; color:var(--ink-dim); font-size:13px; padding:30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">STUDY IE — VOCAB NOTE</div>
  <h1>お知らせ・更新情報</h1>
  <div class="sub">アプリの改善履歴です <a class="back-link" href="./">← 学習に戻る</a></div>

  <div class="timeline" id="timeline"></div>
  <div class="empty-msg hidden" id="emptyMsg">更新情報を読み込めませんでした</div>
</div>

<script>
(function applySavedTheme(){
  let saved = 'night';
  try{ saved = localStorage.getItem('vocabTheme') || 'night'; }catch(e){}
  document.documentElement.setAttribute('data-theme', saved);
})();

async function init(){
  const wrap = document.getElementById('timeline');
  const emptyMsg = document.getElementById('emptyMsg');
  try{
    const res = await fetch('./news.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const news = await res.json();
    if(!news.length){
      emptyMsg.classList.remove('hidden');
      return;
    }
    wrap.innerHTML = news.map(n => `
      <div class="news-item">
        <div class="news-dot"></div>
        <div class="news-date">${formatDate(n.date)}</div>
        <div class="news-title">${n.title}</div>
        <ul class="news-items">
          ${n.items.map(i => `<li>${i}</li>`).join('')}
        </ul>
      </div>
    `).join('');
  }catch(e){
    console.error(e);
    emptyMsg.classList.remove('hidden');
  }
}

function formatDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

init();
</script>
</body>
</html>
