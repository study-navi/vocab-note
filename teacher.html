<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>英単語ノート — 先生用ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#10152b; --bg-elevate:#161d3a; --surface:#212a52; --surface-2:#2a3563;
  --ink:#eef1f8; --ink-dim:#94a0c9; --ink-faint:#5c6796;
  --gold:#e8b95f; --gold-dim:#8a733f; --good:#6fcf97; --warn:#f0c869; --bad:#e8748a;
  --serif:'Shippori Mincho', serif; --sans:'Zen Kaku Gothic New', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  min-height:100vh; display:flex; justify-content:center; padding:24px 16px 60px;
}
.wrap{ width:100%; max-width:760px; }
.eyebrow{ font-size:11px; letter-spacing:0.28em; color:var(--gold); font-weight:500; }
h1{ font-family:var(--serif); font-size:24px; margin-top:4px; margin-bottom:4px; }
.sub{ font-size:12.5px; color:var(--ink-dim); margin-bottom:22px; }

.gate-card, .panel{
  background:var(--bg-elevate); border:1px solid rgba(232,185,95,0.12);
  border-radius:18px; padding:22px 20px; margin-bottom:16px;
}
label.field-label{ display:block; font-size:11.5px; color:var(--ink-dim); margin-bottom:6px; }
select, input[type=password]{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.12);
  background:var(--surface); color:var(--ink); font-family:var(--sans); font-size:14.5px; margin-bottom:14px;
}
.btn{
  padding:12px 20px; border-radius:12px; border:none; background:var(--gold);
  color:var(--bg); font-weight:700; font-size:14px; cursor:pointer;
}
.err-msg{ font-size:12px; color:var(--bad); margin-top:6px; display:none; }

.filter-row{ display:flex; gap:10px; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap; }
.filter-row select{ margin-bottom:0; width:auto; min-width:200px; }

.small{ font-size:11px; color:var(--ink-faint); }
.hidden{ display:none !important; }
.empty-msg{ color:var(--ink-dim); font-size:13px; padding:20px 0; text-align:center; }
.summary-row{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
.summary-item{ background:var(--surface); border-radius:14px; padding:14px 16px; flex:1; min-width:100px; }
.summary-item .num{ font-family:var(--serif); font-size:22px; color:var(--gold); font-weight:700; }
.summary-item .lbl{ font-size:10.5px; color:var(--ink-dim); margin-top:2px; }

/* ---------- 生徒カード一覧 ---------- */
.sort-row{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.sort-chip{
  padding:7px 13px; border-radius:999px; font-size:11.5px; color:var(--ink-dim);
  background:var(--bg-elevate); border:1px solid rgba(255,255,255,0.1); cursor:pointer;
  user-select:none; transition:all .15s ease;
}
.sort-chip.active{ background:var(--gold); color:var(--bg); border-color:var(--gold); font-weight:700; }

.student-list{ display:flex; flex-direction:column; gap:12px; }
.student-card{
  background:var(--bg-elevate); border:1px solid rgba(232,185,95,0.12);
  border-radius:18px; padding:16px 18px; position:relative;
}
.card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px; }
.card-name{ font-family:var(--serif); font-size:17px; font-weight:700; color:var(--ink); }
.card-login{ font-size:10.5px; color:var(--ink-faint); margin-top:3px; display:flex; align-items:center; gap:5px; }
.login-dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none; }
.login-dot.active{ background:var(--good); box-shadow:0 0 6px rgba(111,207,151,0.6); }
.del-btn{
  padding:6px 12px; border-radius:8px; border:1px solid rgba(232,116,138,0.35);
  background:transparent; color:var(--bad); font-size:11px; cursor:pointer; flex:none;
}
.del-btn:active{ background:rgba(232,116,138,0.18); }

.progress-row{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.ring-wrap{ flex:none; width:52px; height:52px; position:relative; }
.ring-wrap svg{ width:100%; height:100%; }
.ring-pct{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:12.5px; font-weight:700; color:var(--gold);
}
.progress-info{ flex:1; }
.progress-count{ font-family:var(--serif); font-size:19px; font-weight:700; color:var(--ink); }
.progress-count .of{ font-size:11.5px; color:var(--ink-faint); font-weight:400; font-family:var(--sans); }
.progress-label{ font-size:10.5px; color:var(--ink-dim); margin-top:1px; }

.stat-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:12px; }
.stat-box{ background:var(--surface); border-radius:12px; padding:9px 6px; text-align:center; }
.stat-box .v{ font-family:var(--serif); font-size:15px; font-weight:700; color:var(--ink); }
.stat-box .v.warn{ color:var(--warn); }
.stat-box .v.bad{ color:var(--bad); }
.stat-box .k{ font-size:9.5px; color:var(--ink-faint); margin-top:2px; letter-spacing:0.02em; }

.level-row{ display:flex; gap:6px; margin-bottom:10px; }
.level-chip{
  flex:1; background:var(--surface); border-radius:10px; padding:7px 4px; text-align:center;
}
.level-chip .lv-v{ font-size:12px; font-weight:700; color:var(--ink); }
.level-chip .lv-k{ font-size:9px; color:var(--ink-faint); margin-top:1px; }

.card-footer{
  display:flex; justify-content:space-between; align-items:center;
  font-size:10.5px; color:var(--ink-faint); padding-top:10px; border-top:1px solid rgba(255,255,255,0.06);
}

@media (min-width: 640px){
  .student-list{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">STUDY IE — VOCAB NOTE</div>
  <h1>先生用ダッシュボード</h1>
  <div class="sub">生徒ごとの学習進捗を確認できます</div>

  <div class="gate-card" id="gateCard">
    <label class="field-label">合言葉</label>
    <input type="password" id="passInput" placeholder="合言葉を入力">
    <button class="btn" onclick="checkPass()">開く</button>
    <div class="err-msg" id="gateErr">合言葉が違います</div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="filter-row">
      <div>
        <label class="field-label">校舎</label>
        <select id="branchFilter" onchange="loadData()">
          <option value="大府校">大府柊山校</option>
          <option value="共和校">共和校</option>
        </select>
      </div>
      <button class="btn" onclick="loadData()">更新</button>
    </div>

    <div class="summary-row" id="summaryRow"></div>

    <div class="sort-row" id="sortRow">
      <div class="sort-chip active" data-sort="mastered" onclick="setSort('mastered')">覚えた語数順</div>
      <div class="sort-chip" data-sort="name" onclick="setSort('name')">名前順</div>
      <div class="sort-chip" data-sort="login" onclick="setSort('login')">最終ログイン順</div>
      <div class="sort-chip" data-sort="weak" onclick="setSort('weak')">苦手が多い順</div>
    </div>

    <div class="student-list" id="studentList"></div>
    <div class="empty-msg hidden" id="emptyMsg">この校舎にはまだ学習記録がありません</div>
  </div>
</div>

<script>
/* =========================================================
   ★ ここに Supabase のプロジェクト情報を入れてください(index.htmlと同じ値) ★
========================================================= */
const SUPABASE_URL = "https://uglxilcwbgqoofnzngux.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_R83zSq90hslRd5jl04sIPg_hZlLxfRC";

/* ★ 先生用の合言葉。厳密なセキュリティではなく簡易的な目隠しです ★ */
const TEACHER_PASSCODE = "studyie2026";

let TOTAL_WORDS = 0, TOTAL_L1 = 0, TOTAL_L2 = 0, TOTAL_L3 = 0, TOTAL_IDIOMS = 0;
let idiomWordIds = new Set();
let wordsLoaded = false;

async function loadWordCounts(){
  try{
    const res = await fetch('./words.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const words = await res.json();
    TOTAL_WORDS = words.length;
    TOTAL_L1 = words.filter(w=>w.level===1).length;
    TOTAL_L2 = words.filter(w=>w.level===2).length;
    TOTAL_L3 = words.filter(w=>w.level===3).length;
    const idioms = words.filter(w=>w.idiomNo);
    TOTAL_IDIOMS = idioms.length;
    idiomWordIds = new Set(idioms.map(w=>w.id));
    wordsLoaded = true;
  }catch(e){
    console.error(e);
  }
}

let supabaseClient = null;
try {
  if (SUPABASE_URL.indexOf("YOUR-PROJECT") === -1) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch(e){ console.error(e); }

async function checkPass(){
  const val = document.getElementById('passInput').value;
  if(val === TEACHER_PASSCODE){
    document.getElementById('gateCard').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    if(!wordsLoaded) await loadWordCounts();
    loadData();
  } else {
    document.getElementById('gateErr').style.display = 'block';
  }
}

let currentRows = [];
let currentSort = 'mastered';

async function loadData(){
  const branch = document.getElementById('branchFilter').value;
  const listEl = document.getElementById('studentList');
  const emptyMsg = document.getElementById('emptyMsg');
  const summaryRow = document.getElementById('summaryRow');
  listEl.innerHTML = "";
  emptyMsg.classList.add('hidden');

  if(!supabaseClient){
    emptyMsg.textContent = "Supabaseが未設定です。teacher.html冒頭のSUPABASE_URL / ANON_KEYを設定してください。";
    emptyMsg.classList.remove('hidden');
    summaryRow.innerHTML = "";
    return;
  }

  const { data: students, error: sErr } = await supabaseClient
    .from('vocab_students')
    .select('id,name,last_login_at')
    .eq('branch', branch)
    .order('name');
  if(sErr){ console.error(sErr); return; }

  if(!students.length){
    emptyMsg.classList.remove('hidden');
    summaryRow.innerHTML = "";
    return;
  }

  const ids = students.map(s=>s.id);
  const { data: progress, error: pErr } = await supabaseClient
    .from('vocab_progress')
    .select('student_id,word_id,level,status,correct_count,wrong_count,last_result,updated_at')
    .in('student_id', ids);
  if(pErr){ console.error(pErr); return; }

  // 苦手判定の基準は生徒画面と共通(要復習/苦手/最優先)
  function classify(row){
    const c = row.correct_count || 0, w = row.wrong_count || 0;
    const total = c + w;
    const accuracy = total ? c/total : 1;
    if(w >= 3 && row.last_result === 'wrong') return 'priority';
    if(w >= 2 && accuracy < 0.7) return 'weak';
    if(w >= 1) return 'review';
    return 'ok';
  }

  const byStudent = {};
  students.forEach(s => byStudent[s.id] = {
    id:s.id, name:s.name, mastered:0, l1:0, l2:0, l3:0, idiomMastered:0, lastUpdate:null, lastLogin:s.last_login_at || null,
    correctSum:0, wrongSum:0, weakCount:0, priorityCount:0,
  });

  progress.forEach(row => {
    const bucket = byStudent[row.student_id];
    if(!bucket) return;
    if(row.status === 2){
      bucket.mastered++;
      if(row.level===1) bucket.l1++;
      if(row.level===2) bucket.l2++;
      if(row.level===3) bucket.l3++;
      if(idiomWordIds.has(row.word_id)) bucket.idiomMastered++;
    }
    bucket.correctSum += row.correct_count || 0;
    bucket.wrongSum += row.wrong_count || 0;
    const c = classify(row);
    if(c === 'weak' || c === 'priority') bucket.weakCount++;
    if(c === 'priority') bucket.priorityCount++;
    if(!bucket.lastUpdate || new Date(row.updated_at) > new Date(bucket.lastUpdate)){
      bucket.lastUpdate = row.updated_at;
    }
  });

  currentRows = Object.values(byStudent);

  // サマリー
  const totalStudents = currentRows.length;
  const avgMastered = totalStudents ? Math.round(currentRows.reduce((s,r)=>s+r.mastered,0)/totalStudents) : 0;
  const activeStudents = currentRows.filter(r=>r.lastLogin && (Date.now()-new Date(r.lastLogin).getTime()) < 7*24*3600*1000).length;
  summaryRow.innerHTML = `
    <div class="summary-item"><div class="num">${totalStudents}</div><div class="lbl">登録生徒数</div></div>
    <div class="summary-item"><div class="num">${avgMastered}</div><div class="lbl">平均・覚えた語数</div></div>
    <div class="summary-item"><div class="num">${activeStudents}</div><div class="lbl">直近7日で学習</div></div>
  `;

  renderStudentList();
}

function setSort(key){
  currentSort = key;
  document.querySelectorAll('.sort-chip').forEach(el=>{
    el.classList.toggle('active', el.dataset.sort === key);
  });
  renderStudentList();
}

function sortRows(rows, key){
  const sorted = rows.slice();
  if(key === 'name'){
    sorted.sort((a,b)=>a.name.localeCompare(b.name, 'ja'));
  }else if(key === 'login'){
    sorted.sort((a,b)=>{
      const at = a.lastLogin ? new Date(a.lastLogin).getTime() : 0;
      const bt = b.lastLogin ? new Date(b.lastLogin).getTime() : 0;
      return bt - at;
    });
  }else if(key === 'weak'){
    sorted.sort((a,b)=> (b.weakCount + b.priorityCount) - (a.weakCount + a.priorityCount));
  }else{
    sorted.sort((a,b)=>b.mastered-a.mastered);
  }
  return sorted;
}

function renderStudentList(){
  const listEl = document.getElementById('studentList');
  const emptyMsg = document.getElementById('emptyMsg');
  const rows = sortRows(currentRows, currentSort);

  if(rows.length === 0){
    listEl.innerHTML = "";
    emptyMsg.classList.remove('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');

  listEl.innerHTML = rows.map(r => {
    const pct = Math.round((r.mastered/TOTAL_WORDS)*100);
    const circumference = 2 * Math.PI * 21; // r=21
    const offset = circumference * (1 - Math.min(1, pct/100));
    const last = r.lastUpdate ? new Date(r.lastUpdate).toLocaleDateString('ja-JP', {month:'numeric', day:'numeric'}) : "まだ学習なし";
    const lastLoginStr = r.lastLogin
      ? new Date(r.lastLogin).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})
      : "未ログイン";
    const isRecentlyActive = r.lastLogin && (Date.now()-new Date(r.lastLogin).getTime()) < 3*24*3600*1000;
    const total = r.correctSum + r.wrongSum;
    const accuracy = total ? Math.round((r.correctSum/total)*100) : null;
    return `
      <div class="student-card">
        <div class="card-top">
          <div>
            <div class="card-name">${r.name}</div>
            <div class="card-login"><span class="login-dot ${isRecentlyActive ? 'active' : ''}"></span>最終ログイン：${lastLoginStr}</div>
          </div>
          <button class="del-btn" onclick="deleteStudent('${r.id}','${r.name.replace(/'/g,"\\'")}')">削除</button>
        </div>

        <div class="progress-row">
          <div class="ring-wrap">
            <svg viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="21" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="5"/>
              <circle cx="24" cy="24" r="21" fill="none" stroke="#e8b95f" stroke-width="5"
                      stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
                      transform="rotate(-90 24 24)"/>
            </svg>
            <div class="ring-pct">${pct}%</div>
          </div>
          <div class="progress-info">
            <div class="progress-count">${r.mastered} <span class="of">/ ${TOTAL_WORDS}語</span></div>
            <div class="progress-label">覚えた語数(習熟度)</div>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-box"><div class="v ${r.weakCount>0?'warn':''}">${r.weakCount}</div><div class="k">苦手</div></div>
          <div class="stat-box"><div class="v ${r.priorityCount>0?'bad':''}">${r.priorityCount}</div><div class="k">最優先</div></div>
          <div class="stat-box"><div class="v">${accuracy===null ? '-' : accuracy + '%'}</div><div class="k">正答率</div></div>
          <div class="stat-box"><div class="v">${r.idiomMastered}<span style="font-size:10px;color:var(--ink-faint)">/${TOTAL_IDIOMS}</span></div><div class="k">熟語</div></div>
        </div>

        <div class="level-row">
          <div class="level-chip"><div class="lv-v">${r.l1}/${TOTAL_L1}</div><div class="lv-k">基礎</div></div>
          <div class="level-chip"><div class="lv-v">${r.l2}/${TOTAL_L2}</div><div class="lv-k">標準</div></div>
          <div class="level-chip"><div class="lv-v">${r.l3}/${TOTAL_L3}</div><div class="lv-k">発展</div></div>
        </div>

        <div class="card-footer">
          <span>最終学習：${last}</span>
        </div>
      </div>
    `;
  }).join("");
}

async function deleteStudent(studentId, studentName){
  if(!supabaseClient) return;
  const ok = confirm(`「${studentName}」の記録を削除します。\nこの操作は取り消せません。よろしいですか？`);
  if(!ok) return;
  const { error } = await supabaseClient.from('vocab_students').delete().eq('id', studentId);
  if(error){
    alert('削除に失敗しました: ' + error.message);
    console.error(error);
    return;
  }
  loadData();
}
</script>
</body>
</html>
