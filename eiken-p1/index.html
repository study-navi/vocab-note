<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>準1級 単語マスター</title>
<style>
:root{
  --bg:#0f1a3c; --bg2:#16234f; --card:#1c2a5e; --accent:#6ea8fe; --accent2:#9d7cf7;
  --text:#eef1fb; --sub:#aab4d6; --good:#5fd6a3; --bad:#ff8a8a; --warn:#ffd166;
  --border:rgba(255,255,255,0.12); --shadow:0 8px 24px rgba(0,0,0,0.35);
  --radius:16px;
}
[data-theme="dawn"]{
  --bg:#3a1f3d; --bg2:#4d2a4a; --card:#5a3454; --accent:#ff9a76; --accent2:#ffcf6e;
  --text:#fff4ee; --sub:#e8c9c0; --good:#8fe3b0; --bad:#ff8a8a; --warn:#ffd166;
  --border:rgba(255,255,255,0.14);
}
[data-theme="mint"]{
  --bg:#0c2b28; --bg2:#123a35; --card:#164841; --accent:#4fd1b5; --accent2:#7ee8c0;
  --text:#eafff8; --sub:#a9d8cd; --good:#6ee7a8; --bad:#ff9a9a; --warn:#ffe08a;
  --border:rgba(255,255,255,0.12);
}
[data-theme="sakura"]{
  --bg:#3a1f2c; --bg2:#4a2839; --card:#5b3247; --accent:#ff9ec4; --accent2:#ffc2dd;
  --text:#fff0f6; --sub:#e8c3d6; --good:#8fe3b0; --bad:#ff8a8a; --warn:#ffd166;
  --border:rgba(255,255,255,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--text);
  min-height:100vh;
  padding-bottom:84px;
}
.app{max-width:560px;margin:0 auto;padding:16px 16px 8px;}
header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 2px 14px;
}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em;}
header.top h1 span{color:var(--accent);}
.theme-btn{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:8px 10px;font-size:16px;cursor:pointer;
}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-bottom:14px;
}
.hidden{display:none !important;}
.meter-wrap{display:flex;align-items:center;gap:14px;}
.meter-ring{position:relative;width:76px;height:76px;flex:none;}
.meter-ring svg{transform:rotate(-90deg);}
.meter-ring .bgring{stroke:rgba(255,255,255,0.12);}
.meter-ring .fgring{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s ease;}
.meter-ring .label{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
}
.meter-text{flex:1;}
.meter-text .goal{font-size:13px;color:var(--sub);cursor:pointer;text-decoration:underline dotted;}
.meter-text .big{font-size:22px;font-weight:800;margin:2px 0;}
.stat-row{display:flex;gap:10px;margin-top:12px;}
.stat-box{flex:1;background:rgba(255,255,255,0.05);border-radius:12px;padding:10px;text-align:center;}
.stat-box .n{font-size:20px;font-weight:800;}
.stat-box .l{font-size:11px;color:var(--sub);margin-top:2px;}
h2.section-title{font-size:15px;color:var(--sub);margin:20px 4px 10px;font-weight:700;}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.menu-tile{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;text-align:left;cursor:pointer;color:var(--text);box-shadow:var(--shadow);
  font-family:inherit;
}
.menu-tile .ico{font-size:26px;}
.menu-tile .t{font-weight:700;margin-top:8px;font-size:14.5px;}
.menu-tile .d{font-size:11.5px;color:var(--sub);margin-top:3px;}
.menu-tile.wide{grid-column:1 / -1;display:flex;align-items:center;gap:12px;}
.menu-tile.wide .ico{font-size:24px;}
.menu-tile.wide .t{margin-top:0;}
.btn{
  background:var(--accent);color:#101425;border:none;border-radius:12px;
  padding:12px 18px;font-weight:700;font-size:14.5px;cursor:pointer;
}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn.block{width:100%;}
.btn:disabled{opacity:.4;cursor:default;}
.topbar-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.topbar-nav .back{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer;flex:none;
}
.topbar-nav .ttl{font-weight:700;font-size:16px;}
select, input[type=text]{
  background:var(--bg2);color:var(--text);border:1px solid var(--border);
  border-radius:10px;padding:9px 10px;font-size:13.5px;font-family:inherit;
}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;}
.field select{width:100%;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  background:var(--bg2);border:1px solid var(--border);color:var(--sub);
  border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;
}
.chip.active{background:var(--accent);color:#101425;border-color:var(--accent);font-weight:700;}
/* Flashcard */
.flash-progress{font-size:12px;color:var(--sub);margin-bottom:8px;text-align:center;}
.flashcard{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px;text-align:center;cursor:pointer;box-shadow:var(--shadow);
  position:relative;
}
.flashcard .pos-badge{
  position:absolute;top:14px;left:14px;background:rgba(255,255,255,0.08);
  padding:3px 9px;border-radius:8px;font-size:11px;color:var(--sub);
}
.flashcard .word{font-size:30px;font-weight:800;letter-spacing:.01em;}
.flashcard .meaning{font-size:19px;color:var(--accent2);font-weight:700;margin-top:10px;}
.flashcard .hint{font-size:11.5px;color:var(--sub);margin-top:16px;}
.flash-actions{display:flex;gap:10px;margin-top:16px;}
.flash-actions button{flex:1;padding:14px 8px;border-radius:14px;font-weight:800;font-size:14px;border:none;cursor:pointer;}
.btn-again{background:rgba(255,138,138,0.18);color:var(--bad);}
.btn-good{background:rgba(95,214,163,0.18);color:var(--good);}
.flash-toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.icon-btn{background:transparent;border:none;color:var(--sub);font-size:20px;cursor:pointer;}
/* Quiz */
.quiz-progress{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:10px;}
.quiz-q{
  background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;
  text-align:center;margin-bottom:14px;box-shadow:var(--shadow);
}
.quiz-q .pos-badge{font-size:11px;color:var(--sub);background:rgba(255,255,255,0.08);padding:3px 9px;border-radius:8px;}
.quiz-q .word{font-size:26px;font-weight:800;margin-top:10px;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;
  text-align:left;font-size:14.5px;cursor:pointer;color:var(--text);
}
.choice.correct{background:rgba(95,214,163,0.22);border-color:var(--good);}
.choice.wrong{background:rgba(255,138,138,0.22);border-color:var(--bad);}
.choice:disabled{cursor:default;}
.result-big{text-align:center;padding:20px 0;}
.result-big .score{font-size:44px;font-weight:800;color:var(--accent);}
.result-big .label{color:var(--sub);font-size:13px;margin-top:4px;}
/* word list */
.wordlist-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 4px;border-bottom:1px solid var(--border);
}
.wordlist-item:last-child{border-bottom:none;}
.wordlist-item .wl-left .w{font-weight:700;font-size:14.5px;}
.wordlist-item .wl-left .m{font-size:12.5px;color:var(--sub);margin-top:2px;}
.badge{font-size:10.5px;padding:3px 8px;border-radius:8px;flex:none;margin-left:8px;}
.badge.mastered{background:rgba(95,214,163,0.2);color:var(--good);}
.badge.weak{background:rgba(255,138,138,0.2);color:var(--bad);}
.badge.new{background:rgba(255,255,255,0.08);color:var(--sub);}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;background:var(--bg2);
  border-top:1px solid var(--border);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;
}
.bottom-nav button{
  flex:1;background:transparent;border:none;color:var(--sub);font-size:10.5px;
  padding:8px 2px;cursor:pointer;font-family:inherit;
}
.bottom-nav button .bi{display:block;font-size:19px;margin-bottom:2px;}
.bottom-nav button.active{color:var(--accent);}
.empty-msg{text-align:center;color:var(--sub);font-size:13px;padding:30px 10px;}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--border);padding:10px 18px;border-radius:12px;
  font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:50;
}
.toast.show{opacity:1;}
.search-box{width:100%;margin-bottom:12px;}
.settings-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 4px;border-bottom:1px solid var(--border);
}
.settings-row:last-child{border-bottom:none;}
.settings-row .l{font-size:14px;}
.settings-row .s{font-size:11.5px;color:var(--sub);margin-top:2px;}
.theme-swatches{display:flex;gap:10px;}
.swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.swatch.active{border-color:var(--text);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="bottom-nav" id="bottomNav"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

// ---------- Data ----------
var WORDS = JSON.parse(document.getElementById('words-data').textContent);
var TOTAL_UNITS = WORDS[WORDS.length - 1].unit;
var WORD_BY_ID = {};
WORDS.forEach(function(w){ WORD_BY_ID[w.id] = w; });
var PRE1_WORDS = WORDS.filter(function(w){ return w.tier === 'pre1'; });
var BASIC_WORDS = WORDS.filter(function(w){ return w.tier === 'basic'; });
var ADVANCED_WORDS = WORDS.filter(function(w){ return w.tier === 'advanced'; });
var PRE1_UNIT_MIN = PRE1_WORDS.length ? PRE1_WORDS[0].unit : 1;
var PRE1_UNIT_MAX = PRE1_WORDS.length ? PRE1_WORDS[PRE1_WORDS.length - 1].unit : TOTAL_UNITS;

var PROGRESS_KEY = 'eikenPre1_progress_v1';
var SETTINGS_KEY = 'eikenPre1_settings_v1';
var devMode = false;

function activateDevMode(code){
  try{
    var encEl = document.getElementById('words-data-dev-enc');
    if(!encEl || !code) return false;
    var enc = encEl.textContent.trim();
    if(!enc) return false;
    var bin = atob(enc);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var keyBytes = new TextEncoder().encode(code);
    var out = new Uint8Array(bytes.length);
    for(var i=0;i<bytes.length;i++) out[i] = bytes[i] ^ keyBytes[i % keyBytes.length];
    var json = new TextDecoder('utf-8').decode(out);
    var parsed = JSON.parse(json);
    if(!Array.isArray(parsed) || !parsed.length || !parsed[0].word) throw new Error('bad data');

    WORDS = parsed;
    TOTAL_UNITS = WORDS[WORDS.length - 1].unit;
    WORD_BY_ID = {};
    WORDS.forEach(function(w){ WORD_BY_ID[w.id] = w; });
    PRE1_WORDS = WORDS.filter(function(w){ return w.tier === 'pre1'; });
    BASIC_WORDS = WORDS.filter(function(w){ return w.tier === 'basic'; });
    ADVANCED_WORDS = WORDS.filter(function(w){ return w.tier === 'advanced'; });
    PRE1_UNIT_MIN = PRE1_WORDS.length ? PRE1_WORDS[0].unit : 1;
    PRE1_UNIT_MAX = PRE1_WORDS.length ? PRE1_WORDS[PRE1_WORDS.length - 1].unit : TOTAL_UNITS;

    PROGRESS_KEY = 'eikenPre1_progress_dev_v1';
    progress = loadProgress();
    devMode = true;
    return true;
  }catch(e){
    return false;
  }
}

// ---------- State persistence ----------
function loadProgress(){
  try{
    var raw = localStorage.getItem(PROGRESS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveProgress(){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); }catch(e){}
}
function loadSettings(){
  try{
    var raw = localStorage.getItem(SETTINGS_KEY);
    if(raw) return Object.assign(defaultSettings(), JSON.parse(raw));
  }catch(e){}
  return defaultSettings();
}
function saveSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){}
}
function defaultSettings(){
  return { theme:'night', goal:100 };
}

var progress = loadProgress(); // { [id]: {status,correct,wrong,streak} }
var settings = loadSettings();

function getEntry(id){
  if(!progress[id]) progress[id] = { status:'new', correct:0, wrong:0, streak:0 };
  return progress[id];
}

function markCorrect(id){
  var e = getEntry(id);
  e.correct++; e.streak++;
  if(e.streak >= 2) e.status = 'mastered';
  else if(e.status !== 'mastered') e.status = 'learning';
  saveProgress();
}
function markWrong(id){
  var e = getEntry(id);
  e.wrong++; e.streak = 0; e.status = 'weak';
  saveProgress();
}
function manualMaster(id){
  var e = getEntry(id);
  e.status = 'mastered'; e.streak = 2;
  saveProgress();
}

function stats(){
  var mastered=0, weak=0, studied=0;
  Object.keys(progress).forEach(function(id){
    var e = progress[id];
    if(e.status==='mastered') mastered++;
    else if(e.status==='weak') weak++;
    if(e.correct>0 || e.wrong>0) studied++;
  });
  return { mastered:mastered, weak:weak, studied:studied, total: PRE1_WORDS.length };
}

// ---------- Helpers ----------
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, 1600);
}
function statusOf(id){
  var e = progress[id];
  return e ? e.status : 'new';
}
function filterWords(range){
  if(range === 'weak'){
    return WORDS.filter(function(w){ return statusOf(w.id) === 'weak'; });
  }
  if(range === 'all') return PRE1_WORDS.slice();
  if(range === 'basic') return BASIC_WORDS.slice();
  if(range === 'advanced') return ADVANCED_WORDS.slice();
  var unit = parseInt(range, 10);
  return WORDS.filter(function(w){ return w.unit === unit; });
}
function orderWords(list, order){
  if(order === 'random') return shuffle(list);
  if(order === 'weak_first'){
    return list.slice().sort(function(a,b){
      var sa = statusOf(a.id)==='weak' ? 0 : (statusOf(a.id)==='new' ? 1: 2);
      var sb = statusOf(b.id)==='weak' ? 0 : (statusOf(b.id)==='new' ? 1: 2);
      return sa - sb;
    });
  }
  return list.slice().sort(function(a,b){ return a.id - b.id; }); // number order
}

function ringSVG(pct){
  var r = 32, c = 2*Math.PI*r;
  var off = c * (1 - pct);
  return '<svg width="76" height="76" viewBox="0 0 76 76">' +
    '<circle class="bgring" cx="38" cy="38" r="'+r+'" stroke-width="7" fill="none"/>' +
    '<circle class="fgring" cx="38" cy="38" r="'+r+'" stroke-width="7" fill="none" ' +
    'stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>' +
    '</svg>';
}

function rangeOptionsHTML(includeWeak){
  var html = '<option value="all">準1級 すべて（全'+PRE1_WORDS.length+'語）</option>';
  for(var u=PRE1_UNIT_MIN; u<=PRE1_UNIT_MAX; u++){
    var count = PRE1_WORDS.filter(function(w){return w.unit===u;}).length;
    if(count===0) continue;
    html += '<option value="'+u+'">Unit '+u+'（'+count+'語）</option>';
  }
  if(BASIC_WORDS.length){
    html += '<option value="basic">基礎：2級相当のおさらい（'+BASIC_WORDS.length+'語）</option>';
  }
  if(ADVANCED_WORDS.length){
    html += '<option value="advanced">発展：1級レベル（'+ADVANCED_WORDS.length+'語）</option>';
  }
  if(includeWeak) html += '<option value="weak">苦手単語のみ</option>';
  return html;
}

// ---- Flashcard play ----
function renderFlashPlay(){
  var frag = document.createDocumentFragment();
  frag.appendChild(topbar('単語カード', 'flashSetup'));

  if(!flashSession || flashSession.idx >= flashSession.queue.length){
    return renderFlashDone(frag);
  }

  var total = flashSession.queue.length;
  var w = flashSession.queue[flashSession.idx];
  frag.appendChild(el('div','flash-progress', (flashSession.idx+1) + ' / ' + total));

  var fc = el('div','flashcard');
  fc.innerHTML = posBadgeHtml(w) +
    '<div class="word">'+escapeHtml(w.word)+'</div>' +
    (flashSession.flipped ? '<div class="meaning">'+escapeHtml(w.meaning)+'</div>' : '<div class="hint">タップして意味を見る</div>');
  fc.onclick = function(){ flashSession.flipped = !flashSession.flipped; render(); };
  frag.appendChild(fc);

  var actions = el('div','flash-actions');
  if(flashSession.flipped){
    var again = el('button','btn-again','😵 もう一度');
    again.onclick = function(e){ e.stopPropagation(); markWrong(w.id); nextFlash(); };
    var good = el('button','btn-good','😊 覚えた');
    good.onclick = function(e){ e.stopPropagation(); markCorrect(w.id); flashSession.correctCnt++; nextFlash(); };
    actions.appendChild(again); actions.appendChild(good);
  }
  frag.appendChild(actions);

  var toolbar = el('div','flash-toolbar');
  var shuf = el('button','icon-btn','🔀');
  shuf.title='残りをシャッフル';
  shuf.onclick = function(){
    var rest = flashSession.queue.slice(flashSession.idx+1);
    flashSession.queue = flashSession.queue.slice(0, flashSession.idx+1).concat(shuffle(rest));
    toast('シャッフルしました');
  };
  var status = statusOf(w.id);
  var badgeTxt = status==='mastered' ? '習得済み' : status==='weak' ? '苦手' : status==='learning' ? '学習中' : '未学習';
  toolbar.appendChild(shuf);
  toolbar.appendChild(el('div', null, '<span style="font-size:11.5px;color:var(--sub)">状態: '+badgeTxt+'</span>'));
  frag.appendChild(toolbar);

  return frag;
}
function nextFlash(){
  flashSession.idx++;
  flashSession.flipped = false;
  render();
}
function renderFlashDone(frag){
  var card = el('div','card');
  var s = flashSession;
  card.innerHTML = '<div class="result-big"><div class="score">🎉</div>' +

  });

    var list = orderWords(pool, quizCfg.order);
    if(quizCfg.count !== 'all'){
      list = list.slice(0, parseInt(quizCfg.count,10));
    }
    quizSession = { queue:list, idx:0, score:0, wrongList:[], answered:false, choices:null };
    buildQuizChoices();
    goto('quizPlay');
  };
  card.appendChild(startBtn);

  frag.appendChild(card);

  function refresh(){
    appEl.innerHTML=''; appEl.appendChild(renderHeader()); appEl.appendChild(renderQuizSetup()); renderBottomNav();
  }

function buildQuizChoices(){
  var w = quizSession.queue[quizSession.idx];
  var others = shuffle(WORDS.filter(function(x){return x.id!==w.id;})).slice(0,3);
  var opts = shuffle([w].concat(others));
  quizSession.choices = opts.map(function(o){ return { id:o.id, meaning:o.meaning, correct:o.id===w.id }; });
  quizSession.answered = false;
}

function renderQuizPlay(){
  var frag = document.createDocumentFragment();
  frag.appendChild(topbar('4択クイズ', 'quizSetup'));

  if(!quizSession || quizSession.idx >= quizSession.queue.length){
    goto('quizResult');
    return frag;
  }

  var total = quizSession.queue.length;
  var w = quizSession.queue[quizSession.idx];
  var prog = el('div','quiz-progress');
  prog.innerHTML = '<span>問題 '+(quizSession.idx+1)+' / '+total+'</span><span>正解 '+quizSession.score+'</span>';
  frag.appendChild(prog);

  var q = el('div','quiz-q');
  q.innerHTML = posBadgeHtml(w) + '<div class="word">'+escapeHtml(w.word)+'</div>';
  frag.appendChild(q);

  var choicesEl = el('div','choices');
  quizSession.choices.forEach(function(c){
    var b = el('button','choice', escapeHtml(c.meaning));
    if(quizSession.answered){
      b.disabled = true;
      if(c.correct) b.classList.add('correct');
      else if(c.picked) b.classList.add('wrong');
    }
    b.onclick = function(){
      if(quizSession.answered) return;
      quizSession.answered = true;
      c.picked = true;
      if(c.correct){
        quizSession.score++;
        markCorrect(w.id);
      } else {
        quizSession.wrongList.push(w);
        markWrong(w.id);
      }
      render();
      setTimeout(function(){
        quizSession.idx++;
        if(quizSession.idx < quizSession.queue.length) buildQuizChoices();
        render();
      }, 900);
    };
    choicesEl.appendChild(b);
  });
  frag.appendChild(choicesEl);

  return frag;
}

  var frag = document.createDocumentFragment();

var wordListState = { query:'', unit:'all' };
function renderWordList(){
  var frag = document.createDocumentFragment();
  frag.appendChild(topbar('単語一覧'));

  var card = el('div','card');
  var search = el('input','search-box');
  search.type='text'; search.placeholder='英単語 または 日本語の意味で検索';
  search.value = wordListState.query;
  search.oninput = function(){ wordListState.query = search.value; renderListBody(); };
  card.appendChild(search);

  var sel = el('select'); sel.style.width='100%'; sel.style.marginBottom='6px';
  sel.innerHTML = rangeOptionsHTML(false);
  sel.value = wordListState.unit;
  sel.onchange = function(){ wordListState.unit = sel.value; renderListBody(); };
  card.appendChild(sel);

  frag.appendChild(card);

  var listCard = el('div','card');
  listCard.id = 'wordListBody';
  frag.appendChild(listCard);

  function renderListBody(){
    var body = document.getElementById('wordListBody');
    if(!body) return;
    var list = filterWords(wordListState.unit);
    var q = wordListState.query.trim().toLowerCase();
    if(q){
      list = list.filter(function(w){
        return w.word.toLowerCase().indexOf(q)>=0 || w.meaning.indexOf(q)>=0;
      });
    }
    body.innerHTML = '';
    if(list.length===0){
      body.innerHTML = '<div class="empty-msg">該当する単語が見つかりません</div>';
      return;
    }
    list.slice(0,300).forEach(function(w){
      var item = el('div','wordlist-item');
      var st = statusOf(w.id);
      var badgeCls = st==='mastered' ? 'mastered' : st==='weak' ? 'weak' : 'new';
      var badgeTxt = st==='mastered' ? '習得' : st==='weak' ? '苦手' : st==='learning' ? '学習中' : '未';
      var tierTag = w.tier === 'advanced' ? ' <span style="color:var(--warn);font-size:10.5px;">[発展]</span>' :
        w.tier === 'basic' ? ' <span style="color:var(--good);font-size:10.5px;">[基礎]</span>' : '';
      item.innerHTML = '<div class="wl-left"><div class="w">'+escapeHtml(w.word)+posSpanHtml(w)+tierTag+'</div>' +
        '<div class="m mval hidden">'+escapeHtml(w.meaning)+'</div></div>' +
        '<span class="badge '+badgeCls+'">'+badgeTxt+'</span>';
      item.onclick = function(){
        item.querySelector('.mval').classList.toggle('hidden');
      };
      body.appendChild(item);
    });
    if(list.length>300){
      var more = el('div','empty-msg','他 '+(list.length-300)+' 語（検索で絞り込んでください）');
      body.appendChild(more);
    }
  }
  setTimeout(renderListBody, 0);

  return frag;
}

// ---- Settings ----
function renderSettings(){
  var frag = document.createDocumentFragment();
  frag.appendChild(topbar('設定'));

  var card = el('div','card');
  var row1 = el('div','settings-row');
  row1.innerHTML = '<div><div class="l">テーマカラー</div><div class="s">好きな配色を選べます</div></div>';
  var sw = el('div','theme-swatches');
  var themes = [['night','#3a5bdc'],['dawn','#ff9a76'],['mint','#4fd1b5'],['sakura','#ff9ec4']];
  themes.forEach(function(t){
    var s = el('div','swatch'+(settings.theme===t[0]?' active':''));
    s.style.background = t[1];
    s.onclick = function(){ settings.theme = t[0]; saveSettings(); render(); };
    sw.appendChild(s);
  });
  row1.appendChild(sw);
  card.appendChild(row1);

  var row2 = el('div','settings-row');
  row2.innerHTML = '<div><div class="l">目標語数</div><div class="s">習得したい単語数の目標</div></div>';
  var goalBtn = el('button','chip', settings.goal + '語');
  goalBtn.onclick = function(){
    var v = prompt('目標語数を入力してください', settings.goal);
    if(v !== null){
      var n = parseInt(v,10);
      if(!isNaN(n) && n>0){ settings.goal=n; saveSettings(); render(); }
    }
  };
  row2.appendChild(goalBtn);
  card.appendChild(row2);

  var row3 = el('div','settings-row');
  row3.innerHTML = '<div><div class="l">総単語数</div><div class="s">準1級 '+PRE1_WORDS.length+'語／基礎 '+BASIC_WORDS.length+'語／発展(1級) '+ADVANCED_WORDS.length+'語</div></div><div>'+WORDS.length+'語</div>';
  card.appendChild(row3);

  var row4 = el('div','settings-row');
  row4.innerHTML = '<div><div class="l">コード</div><div class="s">お持ちの方のみ入力してください</div></div>';
  var codeWrap = el('div');
  codeWrap.style.display = 'flex';
  codeWrap.style.gap = '6px';
  var codeInput = document.createElement('input');
  codeInput.type = 'password';
  codeInput.inputMode = 'numeric';
  codeInput.autocomplete = 'off';
  codeInput.placeholder = '••••';
  codeInput.style.width = '72px';
  var codeBtn = el('button','chip','適用');
  codeBtn.onclick = function(){
    if(activateDevMode(codeInput.value)){
      toast('切り替えました');
      goto('home');
    }else{
      toast('コードが違います');
    }
  };
  codeInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') codeBtn.onclick(); });
  codeWrap.appendChild(codeInput);
  codeWrap.appendChild(codeBtn);
  row4.appendChild(codeWrap);
  card.appendChild(row4);

  frag.appendChild(card);

  var dangerCard = el('div','card');
  var resetBtn = el('button','btn secondary block','学習記録をリセット');
  resetBtn.style.color = 'var(--bad)';
  resetBtn.onclick = function(){
    if(confirm('すべての学習記録（習得・苦手の情報）をリセットします。よろしいですか？')){
      progress = {}; saveProgress(); toast('リセットしました'); goto('home');
    }
  };
  dangerCard.appendChild(resetBtn);
  frag.appendChild(dangerCard);

  return frag;
}

// ---- Bottom nav ----
function renderBottomNav(){
  var nav = document.getElementById('bottomNav');
  nav.innerHTML = '';
  var items = [
    ['home','🏠','ホーム'],
    ['flashSetup','🗂️','カード'],
    ['quizSetup','✅','クイズ'],
    ['weak','⚠️','苦手'],
    ['wordlist','📖','一覧']
  ];
  var activeGroups = {
    home:['home'], flashSetup:['flashSetup','flashPlay'], quizSetup:['quizSetup','quizPlay','quizResult'],
    weak:['weak'], wordlist:['wordlist']
  };
  items.forEach(function(it){
    var b = el('button', null);
    var isActive = activeGroups[it[0]].indexOf(route.name) >= 0;
    if(isActive) b.classList.add('active');
    b.innerHTML = '<span class="bi">'+it[1]+'</span>'+it[2];
    b.onclick = function(){ goto(it[0]); };
    nav.appendChild(b);
  });
}

function posBadgeHtml(w){
  return w.pos ? '<div class="pos-badge">'+escapeHtml(w.pos)+'</div>' : '';
}
function posSpanHtml(w){
  return w.pos ? ' <span style="color:var(--sub);font-size:11px;">'+escapeHtml(w.pos)+'</span>' : '';
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ---------- init ----------
render();

})();

</script>
</body>
</html>
